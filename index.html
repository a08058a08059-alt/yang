<!doctype html>

<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>양을 눌러봐 🐑</title>
<style>
:root{color-scheme:light;--ink:#382a25;--pink:#ff6c9c;--cream:#fff8e7}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 20% 15%,#ffe5f3 0,transparent 37%),radial-gradient(ellipse at 85% 85%,#e2e1ff 0,transparent 40%),#fff9ee;overflow-x:hidden}
main{width:min(95%,900px);margin:auto;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 12px}.stage{text-align:center;width:100%;position:relative}
.eyebrow{font-size:13px;letter-spacing:.21em;font-weight:900;color:#a67886}.title{font-size:clamp(23px,4vw,38px);margin:13px 0 20px;letter-spacing:-.06em}.count{font-size:clamp(100px,22vw,185px);font-weight:1000;line-height:.95;letter-spacing:-.09em;color:#ff6496;text-shadow:5px 8px 0 #ffe1e9;font-variant-numeric:tabular-nums;transition:transform .18s}.count.bump{transform:scale(1.16)}
.target{display:grid;place-items:center;margin:5px auto 18px;width:clamp(195px,48vw,310px);height:clamp(195px,48vw,310px);border:0;border-radius:38%;background:linear-gradient(145deg,#ffffff,#fff1de);box-shadow:0 24px 60px #d87a9b30,inset 0 -10px 0 #ffcfdb66;cursor:pointer;transition:transform .14s,box-shadow .2s;touch-action:manipulation}.target:hover{transform:translateY(-5px) rotate(-2deg);box-shadow:0 28px 70px #d87a9b55}.target:active{transform:scale(.94)}.target:focus-visible,.restart:focus-visible{outline:4px solid #8e78e7;outline-offset:5px}.target span{display:block;font-size:clamp(125px,30vw,210px);font-weight:900;line-height:1;letter-spacing:-.14em;padding-right:.14em;color:#3b2825}
.help{font-size:16px;color:#907b73;font-weight:700;margin:10px 0 20px}.progress{max-width:310px;height:10px;background:#f6dedc;border-radius:30px;overflow:hidden;margin:0 auto}.progress div{height:100%;width:0;background:linear-gradient(90deg,#ff89b1,#ff6496);transition:width .3s}
.sheep{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;background:#33212d8c;backdrop-filter:blur(5px);padding:24px}.sheep.show{display:flex;animation:fadein .18s}.sheep-card{position:relative;background:white;padding:12px;border-radius:28px;width:min(80vw,390px);box-shadow:0 26px 90px #2b142b60;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}.sheep-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:black}.sheep-caption{font-size:19px;font-weight:900;margin:12px 0 5px}.sheep-sub{font-size:12px;color:#81726f;margin:0 0 9px}.close{position:absolute;right:4px;top:-42px;color:white;font-weight:800;font-size:14px}.sheep{cursor:pointer}
.final{display:none}.final.show{display:block;animation:pop .5s both}.final h2{font-size:clamp(60px,12vw,125px);letter-spacing:-.085em;line-height:1.15;margin:14px 0;color:#ff528c;text-shadow:5px 6px 0 #ffe0e8}.final p{font-size:clamp(18px,3vw,24px);font-weight:800}.final img{width:min(65vw,260px);border-radius:24px;border:8px solid white;box-shadow:0 10px 40px #ba748d40;display:block;margin:25px auto}.restart{border:0;background:#47313c;color:#fff;padding:16px 32px;border-radius:999px;font-size:16px;font-weight:850;cursor:pointer}.restart:hover{background:#6d4255}.footer{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#b19b99;pointer-events:none}
@keyframes pop{from{transform:scale(.65) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes fadein{from{opacity:0}to{opacity:1}}
@media(max-height:720px){main{padding:18px 10px}.count{font-size:clamp(75px,16vh,125px)}.target{width:clamp(155px,29vh,220px);height:clamp(155px,29vh,220px)}.target span{font-size:clamp(100px,21vh,150px)}.title{margin:6px 0}.help{margin:7px 0 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
(()=>{'use strict';let remaining=10;const game=document.getElementById('game'),count=document.getElementById('count'),target=document.getElementById('target'),bar=document.getElementById('bar'),sheep=document.getElementById('sheep'),caption=document.getElementById('sheepCaption'),final=document.getElementById('final');const texts=['메에~ 🐑','양이 나타났다!','또 양이네? 👀','오늘도 양 🐑','메에에에~','아직도 양이야!','몇 번 남았을까?','거의 다 왔다!','두근두근 💗','드디어 정체 공개!'];
function closeSheep(){if(!sheep.classList.contains('show'))return;sheep.classList.remove('show');if(remaining===0){game.hidden=true;final.classList.add('show');document.title='양수연 🎉';}}
target.addEventListener('click',()=>{if(remaining===0)return;remaining--;count.textContent=remaining;count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump');bar.style.width=((10-remaining)*10)+'%';target.setAttribute('aria-label',`양 누르기, 남은 횟수 ${remaining}`);caption.textContent=texts[9-remaining];sheep.classList.add('show');});sheep.addEventListener('click',closeSheep);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheep.classList.contains('show'))closeSheep();});document.getElementById('restart').addEventListener('click',()=>{remaining=10;count.textContent=10;bar.style.width='0%';final.classList.remove('show');game.hidden=false;target.setAttribute('aria-label','양 누르기, 남은 횟수 10');document.title='양을 눌러봐 🐑';});
})();
</script>
